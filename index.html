<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 21st Birthday, Wut Yee 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Agbalumo&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #faf5ff;
  --bg2: #f3e8ff;
  --bg3: #e9d5ff;
  --accent: #9333ea;
  --accent-soft: #c084fc;
  --ink: #4c1d95;
  --sub: #7e22ce;
  --trunk: #6b21a8;
  --ground: #581c87;
  --card: #ffffff;
  --heart: #f472b6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #1e1033;
    --bg2: #2a1748;
    --bg3: #3b1f5e;
    --accent: #d8b4fe;
    --accent-soft: #c084fc;
    --ink: #f3e8ff;
    --sub: #e9d5ff;
    --trunk: #c084fc;
    --ground: #e9d5ff;
    --card: #2e1a4a;
    --heart: #f9a8d4;
  }
}
:root[data-theme="dark"] {
  --bg1: #1e1033;
  --bg2: #2a1748;
  --bg3: #3b1f5e;
  --accent: #d8b4fe;
  --accent-soft: #c084fc;
  --ink: #f3e8ff;
  --sub: #e9d5ff;
  --trunk: #c084fc;
  --ground: #e9d5ff;
  --card: #2e1a4a;
  --heart: #f9a8d4;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg2); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: linear-gradient(165deg, var(--bg1), var(--bg2) 50%, var(--bg3));
  color: var(--ink);
  font: 400 1rem/1.5 'Public Sans', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100svh;
  padding: 0 12px;
  transition: min-height 1s ease;
}
#head {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  text-align: center;
  transition: max-height 1s ease, opacity 1.2s ease;
}
.on #head { opacity: 1; }
h1, h2 {
  margin: 0;
  font-family: 'Agbalumo', system-ui, sans-serif;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.02em;
}
h1 {
  font-size: clamp(1.6rem, 6vw, 2.1rem);
  margin: 24px 0 12px;
  line-height: 1.25;
}

#stage {
  position: relative;
  width: min(100%, 540px);
  aspect-ratio: 1000 / 1030;
  cursor: pointer;
}
canvas { display: block; width: 100%; height: 100%; }
#hint {
  position: absolute;
  left: 55%;
  top: 36%;
  font-size: 2.4rem;
  line-height: 1;
  transform: rotate(-20deg);
  animation: tap 1.1s ease-in-out infinite;
  pointer-events: none;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
}
@keyframes tap { 50% { transform: translate(-6px, -10px) rotate(-20deg); } }

/* Content after tree */
#rest {
  padding: 12px 16px 72px;
  text-align: center;
}
#rest:not([hidden]) { animation: fadeIn 1.1s both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } }

/* Photo gallery */
#photos {
  max-width: 520px;
  margin: 0 auto 36px;
}
#photos h2 {
  font-size: clamp(1.25rem, 5vw, 1.5rem);
  margin-bottom: 6px;
}
#photos .sub {
  font-size: .9rem;
  color: var(--sub);
  margin: 0 0 22px;
}
.photo-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px 14px;
}
.polaroid {
  background: var(--card);
  padding: 10px 10px 36px;
  border-radius: 6px;
  box-shadow:
    0 4px 14px rgba(147, 51, 234, 0.18),
    0 0 0 2px var(--accent-soft);
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease;
  position: relative;
  width: min(42vw, 160px);
}
.polaroid:nth-child(1) { transform: rotate(-3.5deg); }
.polaroid:nth-child(2) { transform: rotate(2.8deg); }
.polaroid:nth-child(3) { transform: rotate(-1.8deg); }
.polaroid:hover {
  transform: rotate(0deg) scale(1.06);
  box-shadow:
    0 10px 28px rgba(147, 51, 234, 0.28),
    0 0 0 3px var(--accent);
  z-index: 2;
}
.polaroid img {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  border-radius: 3px;
  background: var(--bg2);
}
.polaroid .label {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Agbalumo', system-ui, sans-serif;
  font-size: 0.95rem;
  color: var(--accent);
}
.polaroid::after {
  content: '♡';
  position: absolute;
  top: -8px;
  right: -6px;
  font-size: 1.1rem;
  color: var(--heart);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.15));
}

/* Letter */
#letter-wrap {
  max-width: 32em;
  margin: 8px auto 0;
  position: relative;
  text-align: center;
}
#letter-wrap #letter {
  text-align: left;
}
#letter {
  margin: 0;
  font-family: 'Agbalumo', system-ui, sans-serif;
  font-size: clamp(1.15rem, 4.6vw, 1.4rem);
  line-height: 1.65;
  white-space: pre-wrap;
  color: var(--ink);
  background: var(--card);
  padding: 28px 22px 32px;
  border-radius: 18px;
  box-shadow: 0 6px 24px rgba(147, 51, 234, 0.14);
  border: 2px solid var(--accent-soft);
  position: relative;
  text-align: left;
}
#letter::before {
  content: '🎂';
  position: absolute;
  top: -16px;
  left: 20px;
  font-size: 1.5rem;
}
#letter .g { color: transparent; }
.cur {
  display: inline-block;
  width: 0;
  overflow: visible;
  font-style: normal;
  animation: bl 1s steps(1) infinite;
}
@keyframes bl { 50% { opacity: 0; } }

/* Cute speaker button */
#speak-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 18px auto 0;
  padding: 10px 18px;
  background: var(--card);
  border: 2px solid var(--accent-soft);
  border-radius: 999px;
  color: var(--accent);
  font-family: 'Agbalumo', system-ui, sans-serif;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(147, 51, 234, 0.15);
  transition: transform .2s ease, box-shadow .2s ease, background .2s;
  user-select: none;
}
#speak-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 20px rgba(147, 51, 234, 0.25);
}
#speak-btn.speaking {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
#speak-btn .icon {
  font-size: 1.15rem;
  line-height: 1;
}
#speak-btn.hidden { display: none; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Lightbox */
#lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(40, 15, 70, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
  padding: 20px;
  cursor: pointer;
}
#lightbox.show { opacity: 1; pointer-events: auto; }
#lightbox .frame {
  position: relative;
  max-width: min(92vw, 400px);
  max-height: 90vh;
  background: #fff;
  padding: 12px 12px 44px;
  border-radius: 8px;
  box-shadow: 0 16px 48px rgba(0,0,0,.4), 0 0 0 4px var(--accent);
  transform: scale(.9);
  transition: transform .35s ease;
  cursor: default;
}
#lightbox.show .frame { transform: scale(1); }
#lightbox img {
  display: block;
  width: 100%;
  height: auto;
  max-height: calc(90vh - 70px);
  object-fit: contain;
  border-radius: 4px;
}
#lightbox .cap {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Agbalumo', system-ui, sans-serif;
  font-size: 1.1rem;
  color: #6b21a8;
}
#lightbox .close-hint {
  position: absolute;
  top: -34px;
  right: 0;
  color: #fff;
  font-size: .85rem;
  opacity: .85;
}
</style>
</head>
<body>
<main id="app">
  <div id="hero">
    <div id="head">
      <h1></h1>
    </div>
    <div id="stage" role="button" tabindex="0" aria-label="Tap to plant the seed">
      <canvas id="c"></canvas>
      <span id="hint" aria-hidden="true">👆</span>
    </div>
  </div>

  <section id="rest" hidden>
    <!-- Photo section -->
    <div id="photos">
      <h2>✨ Moments ✨</h2>
      <p class="sub">tap a photo to see it bigger 💜</p>
      <div class="photo-grid" id="photo-grid"></div>
    </div>

    <!-- Birthday letter + voice -->
    <div id="letter-wrap">
      <div id="letter"></div>
      <button id="speak-btn" type="button" aria-label="Listen to the letter">
        <span class="icon">🔊</span>
        <span class="txt">Listen to the letter</span>
      </button>
    </div>
  </section>
</main>

<!-- Large photo viewer -->
<div id="lightbox" aria-hidden="true">
  <div class="frame">
    <span class="close-hint">tap to close</span>
    <img id="lb-img" alt="Enlarged photo">
    <div class="cap" id="lb-cap">💜</div>
  </div>
</div>

<script>
/* ============================================================
   CUSTOMIZE HERE (super easy)
   ============================================================
   1. Change the title if you want.
   2. Put your photos in the same folder:
        photo1.jpg , photo2.jpg  (and optional photo3.jpg)
      Best in 9:16 (vertical) ratio.
   ============================================================ */
const CFG = {
  titulo: 'Happy 21st Birthday,\nWut Yee 🎂',
  carta: `Happy 21st Birthday, Wut Yee!

Wishing you good health and that you stay far away from toxic people. May you achieve all your goals in life.

Starting from this 21st birthday and for many more years to come, I really want to be by your side and make you proud. Please let me always be there for you, Wut Yee, through both your happiest moments and your saddest times.

Please let me stay close to you, Wut Yee.

I hope my gift brings you joy. 💜`
};

/* --- Your photos (2 or 3) --- */
const PHOTO_SRCS = [
  { src: 'photo1.jpg', label: '✨ cute' },
  { src: 'photo2.jpg', label: '💕 young' },
  // { src: 'photo3.jpg', label: '🌸 always' },  // ← uncomment if you have 3 photos
];

/* ============================================================
   No need to touch anything below
   ============================================================ */

const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const stage = $('#stage'), hero = $('#hero'), head = $('#head');
const rest = $('#rest'), L = $('#letter'), hint = $('#hint');
const lightbox = $('#lightbox'), lbImg = $('#lb-img'), lbCap = $('#lb-cap');
const photoGrid = $('#photo-grid');

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GY = 980, BLOOM = 5400, END = 9900;
const clamp = v => Math.min(1, Math.max(0, v));
const ease = x => 1 - Math.pow(1 - x, 3);

const cs = getComputedStyle(document.documentElement);
const C = {
  trunk:  cs.getPropertyValue('--trunk').trim(),
  ground: cs.getPropertyValue('--ground').trim()
};

$('h1').innerHTML = CFG.titulo.replace(/\n/g, '<br>');
document.title = 'Happy 21st Birthday, Wut Yee 🎂';

/* Build polaroid gallery */
PHOTO_SRCS.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'polaroid';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.innerHTML = `
    <img src="${p.src}" alt="Photo ${i + 1}" loading="lazy">
    <span class="label">${p.label}</span>
  `;
  el.onclick = () => openLightbox(p.src, p.label);
  el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLightbox(p.src, p.label);
    }
  };
  photoGrid.appendChild(el);
});

/* hibiscus sprites */
function mk(i, pale) {
  const c = document.createElement('canvas');
  c.width = c.height = 72;
  const g = c.getContext('2d');
  const col = pale
    ? ['#eadcfa', '#dcc6f4']
    : [['#a259e0', '#8a3fcc'], ['#b472ea', '#9a4fd8'], ['#8f45d0', '#7a33b8']][i % 3];
  g.translate(36, 36);
  for (let k = 0; k < 5; k++) {
    g.save();
    g.rotate(i * .9 + k * 1.2566);
    g.fillStyle = col[k % 2];
    g.beginPath();
    g.ellipse(18, 0, 17, 14.5, 0, 0, 7);
    g.fill();
    g.restore();
  }
  const r = g.createRadialGradient(0, 0, 1, 0, 0, 17);
  r.addColorStop(0, pale ? '#a97bd0' : '#2e0a4d');
  r.addColorStop(1, 'rgba(46,10,77,0)');
  g.fillStyle = r;
  g.beginPath();
  g.arc(0, 0, 17, 0, 7);
  g.fill();
  g.rotate(i * 1.7);
  g.strokeStyle = pale ? '#f4eafd' : '#f3c9ff';
  g.lineWidth = 2.4;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(0, 0);
  g.quadraticCurveTo(8, -4, 15, -10 + i * .3);
  g.stroke();
  g.fillStyle = '#ffe79a';
  for (let k = 0; k < 4; k++) {
    g.beginPath();
    g.arc(11 + k * 1.6, -6.5 - k * 1.4 + i * .3, 1.7, 0, 7);
    g.fill();
  }
  return c;
}
const S = [mk(0), mk(1), mk(2), mk(3), mk(4, 1)];

/* seeded random + heart shape */
let sd = 7;
const R = () => {
  sd |= 0;
  sd = sd + 0x6D2B79F5 | 0;
  let t = Math.imul(sd ^ sd >>> 15, 1 | sd);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
function inH(x, y) {
  const u = (x - 500) / 380, v = (880 - y) / 380 - 1, a = u * u + v * v - 1;
  return a * a * a - u * u * v * v * v <= 0;
}

/* tree branches */
const B = [];
function br(x, y, a, len, w0, d, t0, bend) {
  const n = 17;
  let P;
  for (let k = 0; k < 5; k++) {
    P = [];
    let cx = x, cy = y, ca = a;
    for (let i = 0; i <= n; i++) {
      P.push([cx, cy, ca]);
      cx += Math.cos(ca) * len / n;
      cy += Math.sin(ca) * len / n;
      ca += bend + (R() - .5) * .14;
    }
    const e = P[n];
    if (d === 0 || inH(e[0], e[1])) break;
    len *= .78;
  }
  const dur = 380 + len * 1.7;
  B.push({ P, w0, t0, dur });
  if (d >= 4) return;
  const wAt = f => Math.max(3, w0 * (1 - .72 * Math.pow(f, .8)));
  const sp = d === 0
    ? [[.6, -1], [.72, 1], [.84, -1], [1, 0]]
    : d === 1
      ? [[.45, 1], [.75, -1], [1, 0]]
      : [[.6, R() < .5 ? 1 : -1], [1, 0]];
  for (const [f, s] of sp) {
    const p = P[Math.round(f * n)];
    br(
      p[0], p[1],
      p[2] + (s ? s * (.5 + R() * .55) : (R() - .5) * .7),
      len * (.6 + R() * .16),
      wAt(f) * .8,
      d + 1,
      t0 + dur * f,
      (R() - .5) * .05
    );
  }
}
br(500, GY + 4, -Math.PI / 2, 560, 100, 0, 1900, 0);

/* canopy of flowers */
const F = [];
for (let n = 0; n < 780; n++) {
  let best, bd = -1;
  for (let c = 0; c < 6; c++) {
    let x, y;
    do {
      x = 60 + R() * 880;
      y = 25 + R() * 880;
    } while (!inH(x, y));
    let d = 1e9;
    for (const q of F) {
      const dx = q.x - x, dy = q.y - y;
      d = Math.min(d, dx * dx + dy * dy);
    }
    if (d > bd) {
      bd = d;
      best = [x, y];
    }
  }
  F.push({
    x: best[0],
    y: best[1],
    r: 14 + R() * 8,
    k: R() < .14 ? 4 : (R() * 4 | 0),
    tk: 0
  });
}
F.forEach(f => (f.tk = (f.y - 25) / 855 * 2900 + R() * 1100));
F.sort((a, b) => a.y - b.y);

/* draw helpers */
function drawB(g, b, gr) {
  const P = b.P, n = P.length - 1, m = gr * n;
  for (let i = 0; i < n && i < m; i++) {
    const k = Math.min(1, m - i), a = P[i], c = P[i + 1];
    g.lineWidth = Math.max(2.4, b.w0 * (1 - .72 * Math.pow(i / n, .8)));
    g.beginPath();
    g.moveTo(a[0], a[1]);
    g.lineTo(a[0] + (c[0] - a[0]) * k, a[1] + (c[1] - a[1]) * k);
    g.stroke();
  }
}

function scene(g, t) {
  g.lineCap = 'round';
  const gl = ease(clamp((t - 300) / 1700)) * 460;
  if (gl > 1) {
    g.strokeStyle = C.ground;
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(500 - gl, GY);
    g.lineTo(500 + gl, GY);
    g.stroke();
  }
  if (t < 300) {
    const k = t < 0 ? 1 : 1 - t / 300;
    g.globalAlpha = k;
    g.drawImage(S[0], 500 - 75 * k, 270 - 75 * k, 150 * k, 150 * k);
    g.globalAlpha = 1;
  }
  if (t >= 0 && t < 1900) {
    const y = 270 + (GY - 22 - 270) * clamp(t / 1500) ** 2;
    const s = 1 - clamp((t - 1500) / 400);
    g.fillStyle = C.trunk;
    g.beginPath();
    g.arc(500, y, 22 * s * (.3 + .7 * clamp(t / 260)), 0, 7);
    g.fill();
  }
  g.strokeStyle = C.trunk;
  for (const b of B) {
    const r = clamp((t - b.t0) / b.dur);
    if (r > 0) drawB(g, b, ease(r));
  }
  for (const f of F) {
    const e = clamp((t - BLOOM - f.tk) / 420);
    if (e <= 0) continue;
    const s = 1 + 2.70158 * (e - 1) ** 3 + 1.70158 * (e - 1) ** 2;
    const r = f.r * s;
    g.drawImage(S[f.k], f.x - r, f.y - r, r * 2, r * 2);
  }
}

/* canvas sizing + baked final frame */
const bk = document.createElement('canvas');
let sc = 1, baked = false;
function bakeNow() {
  bk.width = cv.width;
  bk.height = cv.height;
  const g = bk.getContext('2d');
  g.setTransform(sc, 0, 0, sc, 0, 0);
  scene(g, 1e9);
}
function fit() {
  const r = cv.getBoundingClientRect();
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * d);
  cv.height = Math.round(r.height * d);
  sc = cv.width / 1000;
  if (baked) bakeNow();
}
fit();
new ResizeObserver(fit).observe(stage);

/* falling flowers */
const P = [];
let acc = 0;
function spawn(dt, t) {
  acc += dt;
  if (acc < .42 || P.length >= 55) return;
  acc = 0;
  const f = F[(Math.random() * F.length) | 0];
  if (f.tk + BLOOM > t - 420) return;
  P.push({
    x: f.x, y: f.y, r: f.r, k: f.k,
    vy: 90 + Math.random() * 70,
    vx: (Math.random() - .5) * 30,
    rot: Math.random() * 6.28,
    vr: (Math.random() - .5) * 2.5,
    ph: Math.random() * 6.28,
    gy: GY - f.r * .7 + Math.random() * 6,
    life: 0
  });
}
function drawP(dt, now) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.y < p.gy) {
      p.y = Math.min(p.gy, p.y + p.vy * dt);
      p.x += (p.vx + Math.sin(p.ph + now / 600) * 26) * dt;
      p.rot += p.vr * dt;
    } else {
      p.life += dt;
      if (p.life > 8) {
        P.splice(i, 1);
        continue;
      }
    }
    ctx.save();
    ctx.globalAlpha = p.life > 6 ? 1 - (p.life - 6) / 2 : 1;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.drawImage(S[p.k], -p.r, -p.r, p.r * 2, p.r * 2);
    ctx.restore();
  }
}

/* main loop */
let T0 = -1, last = 0, shown = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - (last || now)) / 1000);
  last = now;
  const t = T0 < 0 ? -1 : now - T0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (t >= END) {
    if (!baked) {
      baked = true;
      bakeNow();
    }
    ctx.drawImage(bk, 0, 0);
  }
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  if (t < END) scene(ctx, t);
  if (!RM && t > BLOOM + 1400) {
    spawn(dt, t);
    drawP(dt, now);
  }
  if (t >= END && !shown) reveal();
}

function start() {
  if (T0 >= 0) return;
  T0 = performance.now() - (RM ? END + 50 : 0);
  hint.hidden = true;
  stage.removeAttribute('role');
  stage.removeAttribute('tabindex');
  stage.style.cursor = 'default';
}
stage.onclick = start;
stage.onkeydown = e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    start();
  }
};
setTimeout(start, 5000);
requestAnimationFrame(frame);

/* Lightbox */
function openLightbox(src, label) {
  lbImg.src = src;
  lbCap.textContent = label + '  ·  tap to close';
  lightbox.classList.add('show');
  lightbox.setAttribute('aria-hidden', 'false');
}
lightbox.onclick = () => {
  lightbox.classList.remove('show');
  lightbox.setAttribute('aria-hidden', 'true');
};
lightbox.querySelector('.frame').onclick = e => e.stopPropagation();

/* ===== Voice reading – more natural human style ===== */
const speakBtn = $('#speak-btn');
const canSpeak = 'speechSynthesis' in window;
let speaking = false;
let preferredVoice = null;
let speakQueue = [];

function pickVoice() {
  if (!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  // Prefer the most natural-sounding English voices available
  const preferred = [
    // High-quality named voices
    v => /samantha|karen|moira|fiona|victoria|zira|susan|helen|catherine/i.test(v.name) && /en/i.test(v.lang),
    // Google / Microsoft natural voices
    v => /google us english|google uk english female|microsoft.*(zira|aria|jenny|guy)/i.test(v.name),
    // Any en-US / en-GB
    v => /^en-US$/i.test(v.lang),
    v => /^en-GB$/i.test(v.lang),
    v => /en(-|_)?(us|gb)/i.test(v.lang),
    v => /en/i.test(v.lang)
  ];
  for (const test of preferred) {
    const found = voices.find(test);
    if (found) {
      preferredVoice = found;
      return;
    }
  }
  preferredVoice = voices[0] || null;
}

if (canSpeak) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function stopSpeaking() {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  speakQueue = [];
  speaking = false;
  speakBtn.classList.remove('speaking');
  speakBtn.querySelector('.icon').textContent = '🔊';
  speakBtn.querySelector('.txt').textContent = 'Listen to the letter';
}

function speakNext() {
  if (!speakQueue.length) {
    speaking = false;
    speakBtn.classList.remove('speaking');
    speakBtn.querySelector('.icon').textContent = '🔊';
    speakBtn.querySelector('.txt').textContent = 'Listen again';
    return;
  }
  const text = speakQueue.shift();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.88;   // calmer, more natural pace
  utter.pitch = 1.0;   // neutral pitch (less “robotic”)
  utter.volume = 1;
  if (preferredVoice) utter.voice = preferredVoice;
  utter.lang = preferredVoice?.lang || 'en-US';

  utter.onend = () => {
    // short natural pause between sentences
    setTimeout(speakNext, 420);
  };
  utter.onerror = () => {
    speakNext();
  };
  speechSynthesis.speak(utter);
}

function startSpeaking() {
  if (!canSpeak) return;
  stopSpeaking();

  // Split into natural sentences for more human pacing
  const sentences = CFG.carta
    .replace(/\n+/g, ' ')
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g)
    ?.map(s => s.trim())
    .filter(Boolean) || [CFG.carta];

  speakQueue = sentences;
  speaking = true;
  speakBtn.classList.add('speaking');
  speakBtn.querySelector('.icon').textContent = '⏹️';
  speakBtn.querySelector('.txt').textContent = 'Stop reading';

  speakNext();
}

if (canSpeak) {
  speakBtn.addEventListener('click', () => {
    if (speaking) stopSpeaking();
    else startSpeaking();
  });
} else {
  speakBtn.classList.add('hidden');
}

/* typed letter + auto voice */
function type() {
  const T = CFG.carta;
  if (RM) {
    L.textContent = T;
    // still offer voice even with reduced motion
    if (canSpeak) setTimeout(startSpeaking, 400);
    return;
  }
  let i = 0;
  (function step() {
    i++;
    L.innerHTML =
      T.slice(0, i) +
      '<i class="cur">_</i><span class="g">' +
      T.slice(i) +
      '</span>';
    if (i < T.length) {
      setTimeout(step, 48 + (/[.,!?]/.test(T[i - 1]) ? 180 : 0));
    }
  })();

  // Start reading shortly after typing begins so it feels like the letter is being read to her
  if (canSpeak) {
    setTimeout(startSpeaking, 600);
  }
}

function reveal() {
  shown = true;
  const hh = head.scrollHeight;
  head.style.maxHeight = hh + 'px';
  hero.style.minHeight = stage.offsetHeight + hh + 'px';
  document.getElementById('app').classList.add('on');
  rest.hidden = false;
  type();
}
</script>
